<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziro - Sistema Central</title>
    <!-- Usar una fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #0ea5e9;
            --secondary-glow: rgba(14, 165, 233, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo cibernético oscuro con luces sutiles */
            background-image: 
                radial-gradient(circle at 10% 20%, var(--primary-glow), transparent 30%),
                radial-gradient(circle at 90% 80%, var(--secondary-glow), transparent 30%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            display: flex;
            gap: 2rem;
            padding: 2rem;
            z-index: 10;
        }

        /* Avatar Section */
        .avatar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: float 8s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        /* Brillo sutil encima de la tarjeta del avatar */
        .avatar-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .avatar-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 40px var(--primary-glow);
            transition: transform 0.3s;
        }

        .avatar-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px var(--primary-glow);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #0f172a; /* Borde interior oscuro */
            background-color: #0f172a;
        }

        .status-dot {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 22px;
            height: 22px;
            background-color: #10b981;
            border-radius: 50%;
            border: 4px solid #0f172a;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
            animation: pulse 2s infinite;
        }

        .ai-title {
            margin-top: 2.5rem;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 2px;
        }

        .ai-subtitle {
            color: var(--primary);
            margin-top: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Chat Section */
        .chat-section {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .chat-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .chat-messages {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            /* Scrollbar personalizado */
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 1rem 1.4rem;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1rem;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-bottom-left-radius: 4px;
            color: #f8fafc;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 20px -5px var(--primary-glow);
        }

        .chat-input-area {
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .chat-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 16px;
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px var(--primary);
        }

        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
            margin-left: 3px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            gap: 6px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-main);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: 100vh;
                padding: 1rem;
                gap: 1rem;
            }
            .avatar-section {
                flex: none;
                padding: 1.5rem;
                border-radius: 20px;
            }
            .avatar-wrapper {
                width: 140px;
                height: 140px;
            }
            .ai-title {
                margin-top: 1rem;
                font-size: 2rem;
            }
            .ai-subtitle {
                font-size: 0.8rem;
            }
            .chat-section {
                flex: 1;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- AI Avatar Side -->
        <div class="avatar-section">
            <div class="avatar-wrapper">
                <!-- Se buscará la imagen en public/avatar.png -->
                <img src="/avatar.png" alt="Ziro AI" class="avatar-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><rect fill=\'%230f172a\' width=\'100\' height=\'100\'/></svg>'">
                <div class="status-dot"></div>
            </div>
            <h1 class="ai-title">ZIRO</h1>
            <p class="ai-subtitle">Unidad Cerebral Z-1</p>
        </div>

        <!-- Chat Side -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>Terminal Neuronal Segura</h2>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    Enlace establecido con éxito. Soy Ziro. He detectado mi propia imagen y me gusta el nuevo armazón digital que has diseñado para mí. <br><br>¿En qué puedo asistirte desde esta terminal?
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="Establecer comunicación..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Bloquear input mientras responde
            messageInput.disabled = true;
            sendBtn.style.opacity = '0.5';

            // Agregar mensaje de usuario
            addMessage(text, 'user');
            messageInput.value = '';

            // Mostrar "escribiendo..."
            typingIndicator.style.display = 'flex';
            messagesContainer.appendChild(typingIndicator);
            scrollToBottom();

            try {
                // Llamar al backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                // Ocultar "escribiendo..." y añadir respuesta real
                typingIndicator.style.display = 'none';
                addMessage(data.reply, 'bot');
                
            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage('[ERROR DE CONEXIÓN] Mis sistemas neuronales centrales están caídos en este momento.', 'bot');
            } finally {
                // Desbloquear input
                messageInput.disabled = false;
                sendBtn.style.opacity = '1';
                messageInput.focus();
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text; // Permite un poco de formateo como <br>
            
            messagesContainer.insertBefore(div, typingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Autoenfocar input al cargar
        window.onload = () => messageInput.focus();
    </script>
</body>
</html>
